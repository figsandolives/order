# كل ساعة: يقرا المنيو من الإدارة ويحدّث صفحات الأغلفة والمنتجات وخريطة الموقع.
# ما يسوي commit إلا إذا تغيّر شي (منتج جديد، اسم، سعر، وصف، صورة).
name: SEO pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, scripts/seo-pages.mjs]

permissions:
  contents: write
  pages: write

concurrency:
  group: seo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate pages
        run: node scripts/seo-pages.mjs
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "seo-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SEO pages from catalog"
          git push
          # نشر الموقع بعد التحديث (احتياط لو ما انبنى تلقائياً).
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
