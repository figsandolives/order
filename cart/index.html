    // رابط السلة من رسالة الواتساب: صفحة صغيرة لمعاينة الرابط بالشعار، ثم تنقل للمتجر.
    (function () {
      var token = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
      location.replace(/^[A-Z0-9]{16}$/.test(token) ? "/?cart=" + token : "/");
    })();
  </script>
