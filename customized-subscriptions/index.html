<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f3e9">
  <title>اشتراك مخصص | مخبز التين والزيتون</title>
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--green:#173f32;--green-2:#2c6a50;--gold:#c9973a;--cream:#f7f3e9;--paper:#fffdf8;--ink:#19231f;--muted:#6f7d75;--line:#e3ded0;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box;margin:0}
    html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
    html,body{height:100%;overflow:hidden;background:var(--cream)}
    body{font-family:"Noto Kufi Arabic",system-ui,sans-serif;color:var(--ink)}
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    #app{position:relative;height:100dvh;max-width:520px;margin:auto;overflow:hidden}
    .screen{position:absolute;inset:0;display:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
    .screen.on{display:flex;flex-direction:column}
    .logo{display:block;margin:auto;object-fit:contain}

    /* الترحيب والشكر */
    .center{align-items:center;text-align:center;padding-inline:28px}
    .center .logo{width:112px;height:112px;margin:8px auto 0}
    .center .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12dvh}
    .hello{font-size:17px;font-weight:600;color:var(--green-2)}
    .name{font-size:clamp(34px,11vw,50px);font-weight:900;line-height:1.3;color:var(--green);overflow-wrap:anywhere;text-wrap:balance;margin:2px 0 14px}
    .sub{font-size:16px;line-height:1.9;color:var(--muted);max-width:30ch;text-wrap:balance}
    .cta{margin-top:30px;min-width:190px;padding:15px 34px;border-radius:16px;background:var(--green);color:#fff;font-size:18px;font-weight:800;box-shadow:0 12px 28px #173f3233;transition:transform .12s ease-out,background .12s}
    .cta:active{transform:scale(.97);background:#0f2e24}
    .cta[disabled]{opacity:.6}
    #welcome .logo,#welcome .hello,#welcome .name,#welcome .sub,#welcome .cta,#thanks>*{animation:rise .8s var(--ease) both}
    #welcome .hello{animation-delay:.12s}#welcome .name{animation-delay:.2s}#welcome .sub{animation-delay:.3s}#welcome .cta{animation-delay:.42s}
    #welcome.leaving{pointer-events:none}
    #welcome.leaving>*{animation:leave .38s ease-in both}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}}
    @keyframes leave{to{opacity:0;transform:translateY(-22px) scale(.98)}}

    /* الاختيار */
    #builder{gap:9px;padding-bottom:0}
    .top{flex:none;text-align:center;animation:rise .6s var(--ease) both}
    .top .logo{width:50px;height:50px}
    .top strong{display:block;font-size:15px;font-weight:800;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top small{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top bdi{direction:ltr;unicode-bidi:isolate}
    .days{flex:none;height:clamp(150px,28dvh,250px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px}
    .tile,.count{min-width:0;min-height:0;border-radius:12px;animation:tile .55s var(--ease) both;animation-delay:calc(var(--i)*38ms + .08s)}
    .tile{position:relative;display:flex;flex-direction:column;padding:5px 5px 4px;background:var(--paper);border:1.5px solid var(--line);text-align:right;overflow:hidden;transition:border-color .2s,background .2s,transform .12s ease-out}
    .tile:active{transform:scale(.97)}
    .tile b{flex:none;display:block;font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap;line-height:1.5}
    .tile.active{border-color:var(--green);background:#fff;box-shadow:0 0 0 2px #173f3224}
    .tile.active b{color:var(--green)}
    .tile.done{background:#eaf3ed;border-color:#b9d5c5}
    .tile.done.active{border-color:var(--green)}
    .tile.done b{color:var(--green)}
    .tile.done::after{content:"✓";position:absolute;bottom:4px;left:4px;display:grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--green-2);color:#fff;font-size:8px;font-weight:900}
    .tile.pop{animation:pop .5s var(--ease)}
    .tile ul{flex:1;min-height:0;list-style:none;padding:1px 0 0;overflow:hidden;font-size:var(--f,10px);line-height:1.35;font-weight:600;color:var(--ink)}
    .tile li{position:relative;padding-inline-start:6px;overflow-wrap:anywhere}
    .days.tight .tile li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tile li::before{content:"";position:absolute;top:.62em;inset-inline-start:0;width:3px;height:3px;border-radius:50%;background:var(--gold)}
    .count{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green);color:#fff}
    .count strong{font-size:20px;font-weight:800;line-height:1.3;direction:ltr}
    .count span{font-size:10px;font-weight:600;opacity:.8}
    @keyframes tile{from{opacity:0;transform:translateY(12px) scale(.94)}}
    @keyframes pop{0%{transform:scale(.94)}45%{transform:scale(1.05)}100%{transform:none}}

    .panel{flex:1;min-height:0;display:flex;flex-direction:column;margin-inline:-14px;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -10px 34px #173f3214;animation:panel .7s var(--ease) both .14s}
    @keyframes panel{from{opacity:0;transform:translateY(46px)}}
    .chips{flex:none;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:1 0 auto;max-width:128px;padding:7px 8px;border-radius:999px;background:#f0ece0;color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s}
    .chip.answered{background:#dcebe2;color:var(--green)}
    .chip.answered::before{content:"✓ ";font-weight:900}
    .chip.current{background:var(--green);color:#fff}
    .pane{flex:1;min-height:0;display:flex;flex-direction:column}
    .pane.next{animation:slideNext .36s var(--ease) both}
    .pane.day{animation:rise .46s var(--ease) both}
    @keyframes slideNext{from{opacity:0;transform:translateX(-26px)}}
    .head{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
    .head h2{font-size:18px;font-weight:800;color:var(--green);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .head span{flex:none;font-size:12px;font-weight:600;color:var(--gold)}
    .options{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
    .options::-webkit-scrollbar{display:none}
    .option{flex:0 0 calc(50% - 3.5px);min-width:0;min-height:50px;padding:7px 10px;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:700;line-height:1.45;text-wrap:balance;overflow-wrap:anywhere;transition:transform .1s ease-out,background .15s,border-color .15s,color .15s}
    .option:active{transform:scale(.97)}
    .options.dense{gap:5px}
    .dense .option{flex-basis:calc((100% - 10px)/3);min-height:44px;padding:5px 6px;font-size:12px;line-height:1.35}
    .option.none{border-style:dashed;color:var(--muted);background:transparent}
    .option.picked{background:var(--green);border-color:var(--green);border-style:solid;color:#fff}
    .review{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:rise .5s var(--ease) both}
    .review h2{font-size:20px;font-weight:800;color:var(--green)}
    .review p{font-size:13px;line-height:1.8;color:var(--muted);margin-top:4px}
    .review .cta{margin-top:18px}
    .error{min-height:20px;margin-top:8px;font-size:13px;font-weight:700;color:#b43e3e}

    /* الشكر */
    .tick{width:84px;height:84px;margin-bottom:20px}
    .tick circle{fill:#eaf3ed;stroke:var(--green-2);stroke-width:2.5;stroke-dasharray:252;animation:draw .8s var(--ease) both}
    .tick path{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;animation:draw .5s ease-out both .45s}
    @keyframes draw{from{stroke-dashoffset:252}to{stroke-dashoffset:0}}
    #thanks .name{font-size:clamp(28px,9vw,40px);margin-bottom:10px}

    .spinner{width:34px;height:34px;margin:auto;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main id="app"><div class="screen on" id="loading"><div class="spinner" role="status" aria-label="جاري التحميل"></div></div></main>
  <script>
  (() => {
    const API = "https://162-35-27-249.sslip.io/platform-api";
    const ORDINALS = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع"];
    const LOGO = `<img class="logo" src="/logo.png" alt="مخبز التين والزيتون">`;
    const DAYS = ORDINALS.length;
    const app = document.getElementById("app");
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const has = (day, id) => Object.prototype.hasOwnProperty.call(day, id);

    let sub = null, sections = [], days = [], dayIndex = 0, sectionIndex = 0, reviewing = false, locked = false;

    function show(html, id, extra = "") {
      app.innerHTML = `<section class="screen on ${extra}" id="${id}">${html}</section>`;
      return app.firstElementChild;
    }
    const message = (title, text) => show(`${LOGO}<div class="body"><h1 class="name">${esc(title)}</h1><p class="sub">${esc(text)}</p></div>`, "message", "center");

    // ===== مسودة على نفس الجهاز: لو سكّر الصفحة قبل الاعتماد ما يضيع اختياره =====
    const draftKey = () => `customSubDraft_${sub.code}`;
    function saveDraft() { try { localStorage.setItem(draftKey(), JSON.stringify(days)); } catch {} }
    function clearDraft() { try { localStorage.removeItem(draftKey()); } catch {} }
    function loadDraft() {
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem(draftKey())) || []; } catch {}
      return Array.from({ length: DAYS }, (_, index) => {
        const day = {};
        sections.forEach((section, order) => {
          const value = saved[index]?.[section.id];
          if (section.items.includes(value) || (value === null && order > 0)) day[section.id] = value;
        });
        return day;
      });
    }

    const isDone = day => sections.every(section => has(day, section.id));
    const chosen = day => sections.filter(section => has(day, section.id) && day[section.id] !== null).map(section => ({ section: section.title, item: day[section.id] }));
    const doneCount = () => days.filter(isDone).length;

    // ===== الترحيب =====
    function welcome() {
      const screen = show(`${LOGO}<div class="body"><p class="hello">مرحباً</p><h1 class="name">${esc(sub.name)}</h1><p class="sub">هل جاهز لاختيار وجبات اشتراكك المخصص؟</p><button class="cta" id="start">بدء</button></div>`, "welcome", "center");
      screen.querySelector("#start").addEventListener("click", () => {
        screen.classList.add("leaving");
        setTimeout(builder, 360);
      });
    }

    // ===== شاشة الاختيار =====
    function builder() {
      days = loadDraft();
      const first = days.findIndex(day => !isDone(day));
      reviewing = first < 0;
      dayIndex = Math.max(0, first);
      sectionIndex = firstOpenSection(days[dayIndex]);
      show(`<header class="top">${LOGO}<strong>${esc(sub.name)}</strong><small><bdi>${esc(sub.phone)}</bdi> · ${esc(sub.type)}</small></header>
        <div class="days" id="days"></div><div class="panel" id="panel"></div>`, "builder");
      renderDays();
      renderPanel("next");
    }
    function firstOpenSection(day) {
      const index = sections.findIndex(section => !has(day, section.id));
      return index < 0 ? 0 : index;
    }
    function renderDays(popped = -1, animate = true) {
      const box = document.getElementById("days");
      box.innerHTML = days.map((day, index) => {
        const done = isDone(day);
        const list = done ? `<ul>${chosen(day).map(entry => `<li>${esc(entry.item)}</li>`).join("")}</ul>` : "";
        return `<button class="tile${done ? " done" : ""}${!reviewing && index === dayIndex ? " active" : ""}${index === popped ? " pop" : ""}" data-day="${index}" style="--i:${index}${animate ? "" : ";animation-name:none"}" aria-label="اليوم ${ORDINALS[index]}"><b>اليوم ${ORDINALS[index]}</b>${list}</button>`;
      }).join("") + `<div class="count" style="--i:7${animate ? "" : ";animation-name:none"}"><strong>${doneCount()}/${DAYS}</strong><span>أيام</span></div>`;
      if (popped >= 0) box.querySelector(`[data-day="${popped}"]`).style.animationName = "";
      fitTiles(box);
    }
    // كل المربعات بخط واحد؛ لو الأصناف أكثر من المساحة يصغر الخط شوي بدل ما تنقص.
    function fitTiles(box) {
      const lists = [...box.querySelectorAll(".tile.done ul")];
      const fits = () => lists.every(list => list.scrollHeight <= list.clientHeight);
      box.classList.remove("tight");
      for (let size = 10; size >= 7.5; size -= .5) {
        box.style.setProperty("--f", `${size}px`);
        if (fits()) return;
      }
      // أسماء طويلة جداً: كل صنف سطر واحد ينقص من آخره.
      box.classList.add("tight");
    }
    function renderPanel(motion) {
      const panel = document.getElementById("panel");
      if (reviewing) {
        panel.innerHTML = `<div class="review"><h2>اكتملت الأيام السبعة</h2><p>تقدر تضغط على أي يوم فوق لتعديله،<br>أو اعتمد اختياراتك الحين.</p><button class="cta" id="submit">اعتماد الاختيارات</button><p class="error" id="error" role="alert"></p></div>`;
        return;
      }
      const day = days[dayIndex], section = sections[sectionIndex];
      const current = has(day, section.id) ? day[section.id] : undefined;
      const chips = sections.map((item, index) => `<button class="chip${has(day, item.id) ? " answered" : ""}${index === sectionIndex ? " current" : ""}" data-section="${index}">${esc(item.title)}</button>`).join("");
      const options = section.items.map(item => `<button class="option${current === item ? " picked" : ""}" data-item="${esc(item)}">${esc(item)}</button>`).join("");
      const none = sectionIndex > 0 ? `<button class="option none${current === null ? " picked" : ""}" data-none="1">بدون</button>` : "";
      panel.innerHTML = `<div class="chips">${chips}</div>
        <div class="pane ${motion}"><div class="head"><h2>${esc(section.title)}</h2><span>اليوم ${ORDINALS[dayIndex]}</span></div><div class="options${section.items.length > 7 ? " dense" : ""}">${options}${none}</div></div>`;
      panel.querySelector(".chip.current")?.scrollIntoView({ inline: "center", block: "nearest" });
    }
    function pick(value, button) {
      if (locked) return;
      locked = true;
      button.parentElement.querySelectorAll(".picked").forEach(item => item.classList.remove("picked"));
      button.classList.add("picked");
      days[dayIndex][sections[sectionIndex].id] = value;
      saveDraft();
      setTimeout(() => {
        locked = false;
        const day = days[dayIndex];
        if (!isDone(day)) {
          sectionIndex = firstOpenSection(day);
          renderPanel("next");
          return;
        }
        const finished = dayIndex;
        const order = Array.from({ length: DAYS }, (_, step) => (finished + 1 + step) % DAYS);
        const next = order.find(index => !isDone(days[index]));
        reviewing = next === undefined;
        if (!reviewing) { dayIndex = next; sectionIndex = firstOpenSection(days[next]); }
        renderDays(finished, false);
        renderPanel("day");
      }, 200);
    }
    async function submit(button) {
      const error = document.getElementById("error");
      button.disabled = true;
      error.textContent = "";
      try {
        const response = await fetch(`${API}/custom-subs/${sub.code}/submit`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days: days.map(day => ({ items: chosen(day) })) }) });
        if (!response.ok && response.status !== 409) throw new Error((await response.json().catch(() => ({}))).error || "");
        clearDraft();
        thanks();
      } catch (failure) {
        button.disabled = false;
        error.textContent = failure.message || "تعذر الإرسال، تأكد من الإنترنت وحاول مرة ثانية";
      }
    }
    function thanks() {
      show(`${LOGO}<div class="body"><svg class="tick" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="39"/><path d="M26 43l11 11 21-23"/></svg><h1 class="name">شكراً لك، ${esc(sub.name)}</h1><p class="sub">وصلتنا اختياراتك. سيتم مراجعة وتسعير الاشتراك والرد عليك قريباً.</p></div>`, "thanks", "center");
    }

    app.addEventListener("click", event => {
      const target = event.target.closest("button");
      if (!target || locked) return;
      if (target.dataset.day !== undefined) {
        dayIndex = Number(target.dataset.day);
        reviewing = false;
        sectionIndex = firstOpenSection(days[dayIndex]);
        renderDays(-1, false);
        renderPanel("day");
      } else if (target.dataset.section !== undefined) {
        sectionIndex = Number(target.dataset.section);
        renderPanel("next");
      } else if (target.dataset.item !== undefined) pick(target.dataset.item, target);
      else if (target.dataset.none) pick(null, target);
      else if (target.id === "submit") submit(target);
    });

    // ===== البداية =====
    async function start() {
      const code = decodeURIComponent(location.hash.slice(1)).trim();
      if (!/^\d{3}$/.test(code)) return message("الرابط غير صحيح", "تأكد من الرابط الذي وصلك من مخبز التين والزيتون.");
      try {
        const response = await fetch(`${API}/custom-subs/${code}`);
        if (response.status === 404) return message("الرابط غير صحيح", "تأكد من الرابط الذي وصلك من مخبز التين والزيتون.");
        if (!response.ok) throw new Error("load");
        sub = await response.json();
      } catch {
        message("تعذر فتح الصفحة", "تأكد من اتصال الإنترنت ثم حدّث الصفحة.");
        return;
      }
      if (sub.status === "submitted") return thanks();
      sections = sub.sections || [];
      if (!sections.length) return message(`مرحباً ${sub.name}`, "قائمة الوجبات قيد التجهيز، حاول مرة ثانية بعد قليل.");
      welcome();
    }
    window.addEventListener("hashchange", () => location.reload());
    start();
  })();
  </script>
</body>
</html>
